[package]
name = "keystone"
version = "0.1.0"
edition = "2021"
description = "Keystone v0 — a standards-correct OIDC/OAuth2 authorization server (authorization_code + PKCE S256)."
license = "MIT OR Apache-2.0"

[lib]
name = "keystone"
path = "src/lib.rs"

[[bin]]
name = "keystone"
path = "src/main.rs"

[dependencies]
# Contract-specified HTTP framework (Query/Form/State extractors, Json/redirect responses).
axum = "0.8"
# Async runtime axum runs on. `net`/`io-util`/`time`/`sync` back the non-blocking audit
# emitter (bounded mpsc + background worker + hand-rolled HTTP/1.1 POST to Watchtower).
# The `Store` trait is async: handlers `.await` it directly and PgStore drives sqlx natively,
# so a worker thread is NEVER blocked on a DB round-trip (no sync-over-async bridge).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
# Erase the async `Store` trait methods so `Arc<dyn Store>` stays object-safe (the handlers
# depend only on the trait — same seam Watchtower/Keyward use).
async-trait = "0.1"
# RS256 sign/verify. rust_crypto = pure-Rust provider; this pin is load-bearing:
# omitting it makes jsonwebtoken 10 panic at runtime ("Could not determine CryptoProvider").
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
# RSA-2048 keygen at startup; PKCS#1 DER feeds EncodingKey; PublicKeyParts gives n/e for the JWK.
# MUST stay 0.9.x (0.10 is an RC that pulls rand_core 0.9 and breaks the rand 0.8 OsRng path).
rsa = "0.9"
# URL_SAFE_NO_PAD engine for JWK n/e, PKCE S256 challenge, and opaque auth-code encoding.
base64 = "0.22"
# SHA-256 for PKCE S256 verification and the RFC 7638 kid thumbprint.
sha2 = "0.10"
# (De)serialize request params and Claims; serialize discovery/JWKS/token/userinfo responses.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CSPRNG (OsRng) for opaque single-use authorization codes. rand_core 0.6 lineage matches rsa 0.9.
rand = "0.8"
# Ergonomic error enum -> OAuth2 JSON error envelope.
thiserror = "2"
# Structured logging.
tracing = "0.1"
tracing-subscriber = "0.3"
# Portable PostgreSQL data layer. Runtime queries only (sqlx::query/Row) — NO compile-time
# query!/query_as! macros, so the build needs NO database. rustls TLS (no native-tls/openssl).
# PgPool + parameterized standard SQL. Later runs unchanged on FusionDB over pgwire.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
# Argon2id password hashing for the password-fallback login. PHC-string hashes embed the
# salt + params, so users.password_hash is a single self-describing TEXT column (portable SQL).
argon2 = "0.5"
# WebAuthn / passkey ceremonies. `danger-allow-state-serialisation` makes the in-flight
# PasskeyRegistration / PasskeyAuthentication states (De)serializable so they can be parked
# server-side in the webauthn_states table between begin/finish, then dropped.
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }
# Stable per-user WebAuthn user-handle (Uuid v5 of the subject) so register/authenticate agree.
uuid = { version = "1", features = ["v4", "v5", "serde"] }
# HMAC-SHA256 over the opaque session id, keyed by SESSION_SECRET, so a tampered
# `__Host-session` cookie is rejected before any store lookup (defense in depth).
hmac = "0.12"
# Internal mTLS server (env-toggled, default OFF) for the keystone<->sluice hop.
# rustls is PINNED to the `ring` provider (passed explicitly to the ServerConfig /
# client-verifier builders) to MATCH the provider sqlx already compiles — this avoids
# pulling aws-lc-rs (which needs cmake/clang at build time) and avoids the "two
# providers, ambiguous default" panic.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# Load server cert chain + private key + client-CA roots from PEM (no openssl).
rustls-pemfile = "2"
# Serve the axum app over the rustls TLS stream (HTTP/1.1) via hyper's low-level conn.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# `tower_service::Service` trait to drive the axum Router from the manual accept loop.
tower-service = "0.3"

[dev-dependencies]
# ServiceExt::oneshot drives the Router in-process for the end-to-end contract test (no port binding).
tower = { version = "0.5", features = ["util"] }
# SoftPasskey: a pure-software WebAuthn authenticator that drives the real register/authenticate
# ceremonies against the live Webauthn config in tests — proves the passkey path with no browser.
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }
