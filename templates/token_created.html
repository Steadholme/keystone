<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Token created · HOLDFAST</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="page-console">
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand brand--sm" href="/account" aria-label="HOLDFAST home"><span class="brand__glyph" aria-hidden="true"><svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M24 4 8 9.5V22c0 11 7 17.4 16 21.5C33 39.4 40 33 40 22V9.5L24 4Z" fill="#4F46E5"/><rect x="20" y="19" width="8" height="13" rx="1" fill="#fff" fill-opacity="0.92"/></svg></span><span class="brand__word">HOLDFAST</span></a>
      <div class="topbar__right"><span class="user-email">{{EMAIL}}</span><a class="btn btn-ghost btn-sm" href="/account">Account</a></div>
    </div>
  </header>
  <main class="console">
    <div class="console__head">
      <h1>Token created</h1>
      <p class="muted">{{NAME}} · {{SCOPES}} · {{DAYS}} day(s)</p>
    </div>
    <section class="card">
      <div class="card__body">
        <div class="secret-once"><code>{{TOKEN}}</code></div>
        <a class="btn btn-primary" href="/account">Done</a>
      </div>
      <div class="card__note">This token value will not be shown again.</div>
    </section>
  </main>
</body>
</html>
