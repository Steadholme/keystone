<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{TITLE}} · Steadholme</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="page-auth">
  <div class="auth-split">
    <aside class="brand-panel">
      <div class="brand-panel__top">
        <a class="brand" href="/login" aria-label="Steadholme Keystone">
          <span class="brand__tile" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          </span>
          <span class="brand__id"><b>Steadholme</b><span>id.w33d.xyz</span></span>
        </a>
      </div>
      <div class="brand-panel__inner">
        <h2 class="brand__headline">Keystone</h2>
        <ul class="brand-facts">
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 11a4 4 0 0 0-4 4v1"/><path d="M16 15.5c0-2.2-1.8-4-4-4"/><path d="M12 7a4 4 0 0 1 4 4v3.5"/><path d="M7.5 8.5a6 6 0 0 1 9 .5"/><path d="M12 11v8"/></svg>Passkeys · WebAuthn · rp w33d.xyz</li>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.5 8.6 8 11 4.5-2.4 8-6 8-11V5l-8-3Z"/></svg>OIDC · PKCE S256 · RS256 JWKS</li>
          <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="7" rx="1.5"/><rect x="2" y="13" width="20" height="7" rx="1.5"/><path d="M6 7.5h.01M6 16.5h.01"/></svg>Self-hosted · sessions end after 8 h</li>
        </ul>
        <p class="brand-panel__foot">© Steadholme <a href="https://status.w33d.xyz">Status</a> <a href="https://w33d.xyz/privacy">Privacy</a></p>
      </div>
      <svg class="brand-watermark" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
        <path d="M10 44V20L24 6l14 14v24"/><path d="M18 44V26h12v18"/>
      </svg>
    </aside>

    <main class="auth-main">
      <div class="auth-card">
        <header class="auth-card__head">
          <h1 class="auth-card__title">{{TITLE}}</h1>
          <p class="auth-card__sub">{{MESSAGE}}</p>
        </header>

        <a class="btn btn-primary btn-block" href="{{LINK_HREF}}">{{LINK_TEXT}}</a>
      </div>

      <footer class="site-foot">
        <span>© Steadholme</span>
        <span class="dot" aria-hidden="true">·</span>
        <a href="#">Status</a>
        <span class="dot" aria-hidden="true">·</span>
        <a href="#">Privacy</a>
      </footer>
    </main>
  </div>
</body>
</html>
