<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Create account · Steadholme</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="page-auth">
  <div class="auth-split">
    <!-- Brand panel (slim header on mobile, full panel on desktop) -->
    <aside class="brand-panel">
      <div class="brand-panel__inner">
        <a class="brand" href="/login" aria-label="Steadholme home">
          <span class="brand__glyph" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="hf-shield" x1="8" y1="4" x2="40" y2="44" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#818CF8"/>
                  <stop offset="1" stop-color="#4F46E5"/>
                </linearGradient>
              </defs>
              <path d="M24 4 8 9.5V22c0 11 7 17.4 16 21.5C33 39.4 40 33 40 22V9.5L24 4Z" fill="url(#hf-shield)"/>
              <path d="M24 8.4 12 12.6V22c0 8.6 5.3 13.9 12 17.4 6.7-3.5 12-8.8 12-17.4v-9.4L24 8.4Z" fill="#0F172A" fill-opacity="0.18"/>
              <rect x="20" y="19" width="8" height="13" rx="1" fill="#fff" fill-opacity="0.92"/>
              <path d="M20 19v-2.5a4 4 0 0 1 8 0V19" stroke="#fff" stroke-width="2" stroke-opacity="0.92" fill="none"/>
              <circle cx="24" cy="24.5" r="1.6" fill="#4F46E5"/>
            </svg>
          </span>
          <span class="brand__word">Steadholme</span>
        </a>
        <p class="brand__tagline">Sovereign Identity</p>
        <p class="brand__lede">Create your access to the keep.</p>
        <ul class="trust-chips">
          <li class="chip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.5 8.6 8 11 4.5-2.4 8-6 8-11V5l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg>
            Passkey-ready
          </li>
          <li class="chip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
            Self-hosted
          </li>
          <li class="chip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            End-to-end owned
          </li>
        </ul>
      </div>
      <svg class="brand-watermark" viewBox="0 0 48 48" fill="currentColor" aria-hidden="true">
        <path d="M24 2 6 8v14c0 12.6 8 19.8 18 24 10-4.2 18-11.4 18-24V8L24 2Zm0 6.1L36 12v10c0 9.6-6 15.5-12 18.6C18 37.5 12 31.6 12 22V12l12-3.9Z"/>
      </svg>
    </aside>

    <!-- Auth card -->
    <main class="auth-main">
      <div class="auth-card">
        <header class="auth-card__head">
          <h1 class="auth-card__title">Create your account</h1>
          <p class="auth-card__sub">Register with your email and a password to get started.</p>
        </header>

        <div class="alert-area" role="alert" aria-live="assertive">{{ERROR}}</div>

        <form class="auth-form" method="post" action="/register">
          <input type="hidden" name="csrf_token" value="{{CSRF}}">

          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email"
                   value="{{EMAIL}}" autocapitalize="none" spellcheck="false" required>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="new-password"
                   minlength="8" required>
            <p class="field__hint">At least 8 characters.</p>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Create account</button>
        </form>

        <div class="auth-card__foot">
          <span class="muted">Already have an account?</span>
          <a class="link-muted" href="/login">Sign in</a>
        </div>
      </div>

      <footer class="site-foot">
        <span>© Steadholme</span>
        <span class="dot" aria-hidden="true">·</span>
        <a href="#">Status</a>
        <span class="dot" aria-hidden="true">·</span>
        <a href="#">Privacy</a>
      </footer>
    </main>
  </div>
</body>
</html>
