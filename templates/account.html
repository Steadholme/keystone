<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account · HOLDFAST Keystone</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="card">
    <h1>Your account</h1>
    <p class="sub">You are signed in.</p>
    <p class="kv"><b>Subject</b> &nbsp;<code>{{SUB}}</code></p>
    <p class="kv"><b>Email</b> &nbsp;{{EMAIL}}</p>
    <p class="kv"><b>Passkeys</b> &nbsp;{{PASSKEYS}}</p>
    <button id="register-passkey" type="button">Register a passkey</button>
    <div id="reg-status" class="status"></div>
    <form method="post" action="/logout">
      <input type="hidden" name="csrf_token" value="{{CSRF}}">
      <button class="danger" type="submit">Log out</button>
    </form>
  </main>
  <script src="/static/login.js"></script>
</body>
</html>
